<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Life Simulator - Mobile Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            max-width: 100%;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.8em;
        }

        .game-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 10px;
            background: #34495e;
            border-radius: 0 0 10px 10px;
        }

        /* Canvas */
        canvas {
            border: 3px solid #27ae60;
            background: #87ceeb;
            border-radius: 8px;
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        /* Sidebar */
        .sidebar {
            background: #2c3e50;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            max-height: 400px;
            border: 2px solid #34495e;
        }

        .sidebar h3 {
            color: #2ecc71;
            margin-bottom: 10px;
            font-size: 1em;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 8px;
        }

        .stat-item {
            background: #1a252f;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 3px solid #2ecc71;
            color: white;
            font-size: 0.85em;
        }

        .stat-label {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 1em;
            font-weight: bold;
            color: #2ecc71;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #1a252f;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);
            width: 100%;
            transition: width 0.3s ease;
        }

        .section {
            margin-bottom: 12px;
        }

        .section-title {
            color: #f39c12;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .game-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8em;
            font-weight: bold;
        }

        .game-button:active {
            background: #229954;
            transform: scale(0.95);
        }

        .game-button.disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .game-button.selected {
            background: #f39c12;
            border: 2px solid #e67e22;
        }

        .day-cycle {
            background: #1a252f;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 8px;
            text-align: center;
            border: 1px solid #27ae60;
        }

        .day-number {
            font-size: 1.3em;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 3px;
        }

        .season {
            color: #f39c12;
            font-size: 0.8em;
        }

        .time-display {
            color: #3498db;
            font-size: 0.75em;
            margin-top: 3px;
        }

        .message-box {
            background: #16a085;
            color: white;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 8px;
            min-height: 30px;
            border-left: 3px solid #1abc9c;
            font-size: 0.8em;
            line-height: 1.3;
        }

        /* Mobile Controls */
        .mobile-controls {
            background: #1a252f;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #34495e;
            margin-bottom: 10px;
        }

        .controls-title {
            color: #ecf0f1;
            font-size: 0.85em;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
        }

        .wasd-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .wasd-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: 0.9em;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .wasd-button:active {
            background: #229954;
            transform: scale(0.95);
        }

        .wasd-button.empty {
            background: transparent;
            cursor: default;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .action-button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: 0.85em;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .action-button:active {
            background: #c0392b;
            transform: scale(0.95);
        }

        .action-label {
            font-size: 0.7em;
            opacity: 0.8;
            margin-top: 2px;
        }

        .inventory-slot {
            background: #1a252f;
            padding: 6px;
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 2px solid #3498db;
            color: white;
            font-size: 0.75em;
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-count {
            background: #27ae60;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.8em;
        }

        .shop-item {
            background: #1a252f;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 2px solid #e74c3c;
            color: white;
            font-size: 0.75em;
        }

        .shop-item-name {
            color: #ecf0f1;
            margin-bottom: 3px;
        }

        .shop-item-price {
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.8em;
        }

        .shop-button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7em;
            margin-top: 3px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .shop-button:active {
            background: #c0392b;
        }

        .shop-button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .tool-button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.75em;
            font-weight: bold;
        }

        .tool-button:active {
            background: #229954;
            transform: scale(0.95);
        }

        .tool-button.selected {
            background: #f39c12;
            border: 2px solid #e67e22;
        }

        @media (min-width: 768px) {
            .game-wrapper {
                grid-template-columns: 1fr 300px;
            }

            .sidebar {
                max-height: 600px;
            }
        }

        .tooltip {
            font-size: 0.7em;
            color: #95a5a6;
            margin-top: 3px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🌾 Farm Life Simulator 🌾</h1>
            <p>Mobile-Optimized Version - WASD + BNM Controls</p>
        </div>

        <div class="game-wrapper">
            <div>
                <canvas id="gameCanvas" width="600" height="500"></canvas>
            </div>

            <div class="sidebar">
                <!-- Day & Season Info -->
                <div class="day-cycle">
                    <div class="day-number">Day <span id="dayNumber">1</span></div>
                    <div class="season" id="seasonDisplay">Spring</div>
                    <div class="time-display" id="timeDisplay">6:00 AM</div>
                </div>

                <!-- Messages -->
                <div class="message-box" id="messageBox">
                    Welcome! Use WASD to move, BNM for actions.
                </div>

                <!-- Mobile Controls -->
                <div class="mobile-controls">
                    <div class="controls-title">⌨️ MOVEMENT (WASD)</div>
                    <div class="wasd-grid">
                        <div class="wasd-button empty"></div>
                        <button class="wasd-button" id="btnW" ontouchstart="moveUp()" ontouchend="stopMove()">W<br>↑</button>
                        <div class="wasd-button empty"></div>
                        
                        <button class="wasd-button" id="btnA" ontouchstart="moveLeft()" ontouchend="stopMove()">A<br>←</button>
                        <button class="wasd-button empty"></button>
                        <button class="wasd-button" id="btnD" ontouchstart="moveRight()" ontouchend="stopMove()">D<br>→</button>
                        
                        <div class="wasd-button empty"></div>
                        <button class="wasd-button" id="btnS" ontouchstart="moveDown()" ontouchend="stopMove()">S<br>↓</button>
                        <div class="wasd-button empty"></div>
                    </div>

                    <div class="controls-title">🎯 ACTIONS (BNM)</div>
                    <div class="action-buttons">
                        <button class="action-button" id="btnB" ontouchstart="performAction()" ontouchend="stopAction()">
                            B<br><span class="action-label">ACTION</span>
                        </button>
                        <button class="action-button" id="btnN" ontouchstart="openShop()" ontouchend="stopAction()">
                            N<br><span class="action-label">SHOP</span>
                        </button>
                        <button class="action-button" id="btnM" ontouchstart="sleep()" ontouchend="stopAction()">
                            M<br><span class="action-label">SLEEP</span>
                        </button>
                    </div>
                </div>

                <!-- Stats Section -->
                <h3>📊 Stats</h3>
                <div class="stat-item">
                    <div class="stat-label">💰 Gold</div>
                    <div class="stat-value" id="goldDisplay">500</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">❤️ Energy</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="energyBar" style="width: 100%"></div>
                    </div>
                    <div class="stat-value" id="energyDisplay">100/100</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">😊 Happiness</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="happinessBar" style="width: 100%; background: linear-gradient(90deg, #e74c3c 0%, #f39c12 100%);"></div>
                    </div>
                    <div class="stat-value" id="happinessDisplay">100/100</div>
                </div>

                <!-- Tools Section -->
                <h3>🔧 Tools</h3>
                <div class="tools-grid">
                    <button class="tool-button selected" id="toolWatering" onclick="selectTool('watering')">💧 Watering</button>
                    <button class="tool-button" id="toolHoe" onclick="selectTool('hoe')">🌾 Hoe</button>
                    <button class="tool-button" id="toolPickaxe" onclick="selectTool('pickaxe')">⚒️ Pickaxe</button>
                    <button class="tool-button" id="toolAxe" onclick="selectTool('axe')">🪓 Axe</button>
                </div>

                <!-- Quick Actions -->
                <h3>⚡ Quick</h3>
                <div class="button-group">
                    <button class="game-button" onclick="eat()">🍎 Eat</button>
                    <button class="game-button" onclick="saveGame()">💾 Save</button>
                </div>

                <!-- Inventory Section -->
                <h3>🎒 Inventory</h3>
                <div id="inventoryDisplay"></div>

                <!-- Crops Info -->
                <h3>🌱 Growing</h3>
                <div id="cropsDisplay"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Constants
        const TILE_SIZE = 40;
        const GRID_WIDTH = 15;
        const GRID_HEIGHT = 12;

        // Crop Types
        const CROPS = {
            wheat: { name: 'Wheat', growth: 5, value: 50, sprite: '🌾', color: '#f1c40f' },
            tomato: { name: 'Tomato', growth: 7, value: 80, sprite: '🍅', color: '#e74c3c' },
            carrot: { name: 'Carrot', growth: 6, value: 70, sprite: '🥕', color: '#e67e22' },
            corn: { name: 'Corn', growth: 8, value: 100, sprite: '🌽', color: '#f4d03f' },
            lettuce: { name: 'Lettuce', growth: 4, value: 40, sprite: '🥬', color: '#27ae60' }
        };

        // Game State
        const gameState = {
            player: { x: 7, y: 9, energy: 100, happiness: 100 },
            gold: 500,
            day: 1,
            season: 'Spring',
            time: 6,
            selectedTool: 'watering',
            tiles: [],
            inventory: {
                seeds_wheat: 10,
                seeds_tomato: 5,
                seeds_carrot: 5,
                seeds_corn: 3,
                seeds_lettuce: 8
            },
            harvested: {}
        };

        let moveDirection = null;
        let isMoving = false;

        // Initialize Tiles
        function initTiles() {
            gameState.tiles = [];
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    gameState.tiles.push({
                        x: x,
                        y: y,
                        type: 'grass',
                        crop: null,
                        growth: 0,
                        watered: false
                    });
                }
            }
        }

        // Get Tile at Position
        function getTileAt(x, y) {
            return gameState.tiles.find(t => t.x === x && t.y === y);
        }

        // Draw Game
        function draw() {
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid & Tiles
            for (let tile of gameState.tiles) {
                const px = tile.x * TILE_SIZE;
                const py = tile.y * TILE_SIZE;

                ctx.fillStyle = tile.type === 'grass' ? '#7cb342' : '#8d6e63';
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

                ctx.strokeStyle = '#558b2f';
                ctx.lineWidth = 1;
                ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

                if (tile.watered) {
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.3)';
                    ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }

                if (tile.crop) {
                    const cropData = CROPS[tile.crop];
                    const progress = tile.growth / cropData.growth;
                    
                    ctx.fillStyle = cropData.color;
                    ctx.font = `${Math.floor(20 + progress * 15)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(cropData.sprite, px + TILE_SIZE / 2, py + TILE_SIZE / 2);

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fillRect(px + 2, py + TILE_SIZE - 5, TILE_SIZE - 4, 4);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(px + 2, py + TILE_SIZE - 5, (TILE_SIZE - 4) * progress, 4);
                }
            }

            // Draw Player
            ctx.fillStyle = '#e74c3c';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧑', gameState.player.x * TILE_SIZE + TILE_SIZE / 2, gameState.player.y * TILE_SIZE + TILE_SIZE / 2);

            updateUI();
        }

        // Movement Functions
        function moveUp() {
            moveDirection = 'up';
            isMoving = true;
            move();
        }

        function moveDown() {
            moveDirection = 'down';
            isMoving = true;
            move();
        }

        function moveLeft() {
            moveDirection = 'left';
            isMoving = true;
            move();
        }

        function moveRight() {
            moveDirection = 'right';
            isMoving = true;
            move();
        }

        function move() {
            if (!moveDirection) return;
            
            switch(moveDirection) {
                case 'up':
                    gameState.player.y = Math.max(0, gameState.player.y - 1);
                    break;
                case 'down':
                    gameState.player.y = Math.min(GRID_HEIGHT - 1, gameState.player.y + 1);
                    break;
                case 'left':
                    gameState.player.x = Math.max(0, gameState.player.x - 1);
                    break;
                case 'right':
                    gameState.player.x = Math.min(GRID_WIDTH - 1, gameState.player.x + 1);
                    break;
            }
            
            gameState.player.energy -= 0.5;
            gameState.player.energy = Math.max(0, gameState.player.energy);
            draw();
        }

        function stopMove() {
            moveDirection = null;
            isMoving = false;
        }

        function stopAction() {
            // Button release
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            switch(key) {
                case 'w':
                    moveUp();
                    break;
                case 'a':
                    moveLeft();
                    break;
                case 's':
                    moveDown();
                    break;
                case 'd':
                    moveRight();
                    break;
                case 'b':
                    performAction();
                    break;
                case 'n':
                    openShop();
                    break;
                case 'm':
                    sleep();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) {
                stopMove();
            }
        });

        // UI Update
        function updateUI() {
            document.getElementById('dayNumber').textContent = gameState.day;
            document.getElementById('seasonDisplay').textContent = gameState.season;
            document.getElementById('timeDisplay').textContent = `${gameState.time}:00 ${gameState.time < 12 ? 'AM' : 'PM'}`;
            document.getElementById('goldDisplay').textContent = gameState.gold;
            document.getElementById('energyDisplay').textContent = `${gameState.player.energy.toFixed(0)}/100`;
            document.getElementById('happinessDisplay').textContent = `${gameState.player.happiness.toFixed(0)}/100`;
            document.getElementById('energyBar').style.width = gameState.player.energy + '%';
            document.getElementById('happinessBar').style.width = gameState.player.happiness + '%';

            // Inventory
            const invDisplay = document.getElementById('inventoryDisplay');
            invDisplay.innerHTML = '';
            for (let [item, count] of Object.entries(gameState.inventory)) {
                if (count > 0) {
                    const cropType = item.replace('seeds_', '');
                    const cropData = CROPS[cropType];
                    invDisplay.innerHTML += `
                        <div class="inventory-slot">
                            <div class="inventory-item">
                                <span>${cropData.sprite} ${cropData.name}</span>
                                <span class="inventory-count">${count}</span>
                            </div>
                        </div>
                    `;
                }
            }

            // Growing Crops
            const cropsDisplay = document.getElementById('cropsDisplay');
            let croppingCrops = gameState.tiles.filter(t => t.crop);
            cropsDisplay.innerHTML = '';
            croppingCrops.forEach(tile => {
                const cropData = CROPS[tile.crop];
                const daysLeft = Math.ceil(cropData.growth - tile.growth);
                cropsDisplay.innerHTML += `
                    <div class="inventory-slot">
                        <div class="inventory-item">
                            <span>${cropData.sprite} ${cropData.name}</span>
                            <span class="inventory-count">${daysLeft}d</span>
                        </div>
                        <div class="progress-bar" style="margin-top: 3px; margin-bottom: 0;">
                            <div class="progress-fill" style="width: ${(tile.growth / cropData.growth) * 100}%; background: #2ecc71;"></div>
                        </div>
                    </div>
                `;
            });
        }

        // Actions
        function performAction() {
            const tile = getTileAt(gameState.player.x, gameState.player.y);
            
            switch(gameState.selectedTool) {
                case 'watering':
                    if (tile.crop && !tile.watered) {
                        tile.watered = true;
                        gameState.player.energy -= 3;
                        gameState.player.happiness += 5;
                        showMessage('Crops watered!');
                    }
                    break;
                case 'hoe':
                    if (tile.type === 'grass' && !tile.crop) {
                        tile.type = 'tilled';
                        gameState.player.energy -= 5;
                        showMessage('Soil tilled!');
                        plantCrop();
                    }
                    break;
                case 'pickaxe':
                    showMessage('No rocks here.');
                    break;
                case 'axe':
                    showMessage('No trees here.');
                    break;
            }
            gameState.player.energy = Math.max(0, gameState.player.energy);
            draw();
        }

        function plantCrop() {
            const tile = getTileAt(gameState.player.x, gameState.player.y);
            if (tile.type === 'tilled' && !tile.crop) {
                for (let [seed, count] of Object.entries(gameState.inventory)) {
                    if (seed.startsWith('seeds_') && count > 0) {
                        const cropType = seed.replace('seeds_', '');
                        tile.crop = cropType;
                        tile.growth = 0;
                        gameState.inventory[seed]--;
                        gameState.player.energy -= 2;
                        showMessage(`Planted ${CROPS[cropType].name}!`);
                        break;
                    }
                }
            }
        }

        function selectTool(tool) {
            gameState.selectedTool = tool;
            document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('selected');
            showMessage(`Selected ${tool} tool.`);
        }

        function sleep() {
            nextDay();
        }

        function nextDay() {
            gameState.day++;
            gameState.time = 6;
            gameState.player.energy = 100;
            gameState.player.happiness = Math.max(0, gameState.player.happiness - 10);

            const seasons = ['Spring', 'Summer', 'Fall', 'Winter'];
            const seasonIndex = Math.floor((gameState.day - 1) / 30) % 4;
            gameState.season = seasons[seasonIndex];

            gameState.tiles.forEach(tile => {
                if (tile.crop) {
                    tile.growth++;
                    
                    if (tile.watered && Math.random() > 0.5) {
                        tile.growth += 0.5;
                    }
                    
                    if (tile.growth >= CROPS[tile.crop].growth) {
                        showMessage(`${CROPS[tile.crop].name} ready!`);
                    }
                }
                tile.watered = false;
            });

            draw();
        }

        function eat() {
            if (gameState.gold >= 10) {
                gameState.gold -= 10;
                gameState.player.energy = Math.min(100, gameState.player.energy + 30);
                showMessage('Ate a meal!');
            } else {
                showMessage('Not enough gold!');
            }
            draw();
        }

        function openShop() {
            const seedPrices = {
                wheat: 20,
                tomato: 40,
                carrot: 35,
                corn: 50,
                lettuce: 25
            };

            let shopHTML = '<div style="margin-top: 8px;">';
            for (let [crop, price] of Object.entries(seedPrices)) {
                shopHTML += `
                    <div class="shop-item">
                        <div class="shop-item-name">${CROPS[crop].sprite} ${CROPS[crop].name}</div>
                        <div class="shop-item-price">${price}g</div>
                        <button class="shop-button" onclick="buySeed('${crop}', ${price})">Buy</button>
                    </div>
                `;
            }
            shopHTML += '</div>';
            
            const shopDiv = document.createElement('div');
            shopDiv.innerHTML = shopHTML;
            
            const sidebar = document.querySelector('.sidebar');
            const oldShop = sidebar.querySelector('[style*="margin-top: 8px"]');
            if (oldShop) oldShop.remove();
            sidebar.appendChild(shopDiv);
            
            showMessage('Welcome to shop!');
        }

        function buySeed(crop, price) {
            if (gameState.gold >= price) {
                gameState.gold -= price;
                gameState.inventory[`seeds_${crop}`]++;
                gameState.player.happiness += 10;
                showMessage(`Bought ${CROPS[crop].name}!`);
                draw();
            } else {
                showMessage('Not enough gold!');
            }
        }

        function showMessage(msg) {
            document.getElementById('messageBox').textContent = msg;
        }

        function saveGame() {
            localStorage.setItem('farmGame', JSON.stringify(gameState));
            showMessage('Game saved!');
        }

        function loadGame() {
            const saved = localStorage.getItem('farmGame');
            if (saved) {
                Object.assign(gameState, JSON.parse(saved));
                showMessage('Game loaded!');
            }
        }

        // Initialize
        initTiles();
        loadGame();
        draw();

        // Game Loop
        setInterval(() => {
            gameState.time += 0.5;
            if (gameState.time >= 22) {
                nextDay();
            }
            gameState.player.happiness = Math.max(0, gameState.player.happiness - 0.05);
            draw();
        }, 1000);

        // Harvest on canvas click
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            
            const tile = getTileAt(x, y);
            if (tile && tile.crop) {
                const cropData = CROPS[tile.crop];
                if (tile.growth >= cropData.growth) {
                    if (!gameState.harvested[tile.crop]) {
                        gameState.harvested[tile.crop] = 0;
                    }
                    gameState.harvested[tile.crop]++;
                    gameState.gold += cropData.value;
                    gameState.player.happiness += 20;
                    showMessage(`Harvested ${cropData.name}! +${cropData.value}g`);
                    
                    tile.crop = null;
                    tile.growth = 0;
                    tile.type = 'grass';
                    draw();
                } else {
                    showMessage('Crop not ready yet!');
                }
            }
        });

        // Touch/Mouse button feedback
        const buttons = document.querySelectorAll('.wasd-button, .action-button, .tool-button, .game-button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', function() {
                this.style.opacity = '0.8';
            });
            btn.addEventListener('mouseup', function() {
                this.style.opacity = '1';
            });
            btn.addEventListener('touchstart', function() {
                this.style.opacity = '0.8';
            });
            btn.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });
    </script>
